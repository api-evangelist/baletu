name: Baletu
description: 'Baletu (巴乐兔) is a landlord-direct online residential rental platform operated by
  Shanghai Wanjian Information Technology Co., Ltd. Founded in 2012 and based in Shanghai, it lets
  tenants rent apartments directly from landlords with monthly-payment ("月付") options, reducing
  agency fees. The platform spans first-tier Chinese cities including Beijing, Shanghai, and Shenzhen
  plus more than ten second-tier cities, listing over one million properties. Baletu is a consumer
  proptech company backed by DCM Ventures, Tiantu Capital, Nan Fung Group, and ZWC Partners, having
  raised roughly $140M through a 2018 Series C. It ships consumer iOS/Android apps and a partner
  portal; it does not publish a public developer API program (api.baletu.com serves its own apps).'
